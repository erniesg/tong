name: Playtest Autofix

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: Playtest session id
        required: true
        type: string
      issue_json:
        description: Triaged issue payload (JSON object)
        required: true
        type: string
      recording_url:
        description: Reviewer recording URL (optional metadata)
        required: false
        type: string
      issue_ref:
        description: GitHub issue ref (e.g. erniesg/tong#137)
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      ISSUE_REF: ${{ inputs.issue_ref }}
      SESSION_ID: ${{ inputs.session_id }}
      RECORDING_URL: ${{ inputs.recording_url }}
      TONG_RUNS_R2_BUCKET: ${{ vars.TONG_RUNS_R2_BUCKET }}
      TONG_RUNS_PUBLIC_BASE_URL: ${{ vars.TONG_RUNS_PUBLIC_BASE_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/client/package-lock.json
            apps/server/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          npm --prefix apps/server ci
          npm --prefix apps/client ci

      - name: Run remote autofix
        id: autofix
        run: |
          mkdir -p artifacts/autofix
          printf '%s' '${{ inputs.issue_json }}' > artifacts/autofix/issue.json
          node scripts/autofix-from-analysis.mjs \
            --session-id "$SESSION_ID" \
            --issue-json-file artifacts/autofix/issue.json \
            --output artifacts/autofix/result.json
          echo "result_json=artifacts/autofix/result.json" >> "$GITHUB_OUTPUT"

      - name: Read autofix status
        id: status
        run: |
          STATUS=$(node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('${{ steps.autofix.outputs.result_json }}','utf8'));process.stdout.write(r.status||'error')")
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        if: steps.status.outputs.status == 'validated'
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          branch: autofix/${{ inputs.session_id }}-${{ github.run_id }}
          commit-message: |
            fix(autofix): remote autofix from playtest analysis

            Session: ${{ inputs.session_id }}
            Issue: ${{ inputs.issue_ref }}
          title: 'fix(autofix): remote autofix from playtest analysis'
          body: |
            ## Auto-fix from playtest analysis

            - Session: `${{ inputs.session_id }}`
            - Source issue: `${{ inputs.issue_ref }}`
            - Recording URL: `${{ inputs.recording_url }}`

            ## Validation
            - `npx tsc --noEmit` (apps/client)
            - `node -e "import('./apps/server/src/index.mjs')"`

            ## Artifacts
            - `artifacts/autofix/result.json`

            _Generated by `scripts/autofix-from-analysis.mjs` in GitHub Actions._

      - name: Initialize QA run
        id: qa_init
        run: |
          RUN_DIR=$(python .agents/skills/_functional-qa/scripts/qa_runtime.py init-run validate-issue --target "$ISSUE_REF")
          echo "run_dir=$RUN_DIR" >> "$GITHUB_OUTPUT"

      - name: Add autofix evidence to QA run
        run: |
          RUN_DIR='${{ steps.qa_init.outputs.run_dir }}'
          python - <<'PY'
from pathlib import Path
import json
run_dir = Path('${{ steps.qa_init.outputs.run_dir }}')
result = json.loads(Path('${{ steps.autofix.outputs.result_json }}').read_text())
evidence_path = run_dir / 'evidence.json'
evidence = json.loads(evidence_path.read_text())
evidence['summary'] = f"Autofix workflow status: {result.get('status')}"
evidence['network_traces'] = [{
  'type': 'openai-chat-completions',
  'source': 'scripts/autofix-from-analysis.mjs',
  'status': 'attempted',
  'details': 'generateFix() calls https://api.openai.com/v1/chat/completions with response_format=json_object'
}]
evidence['contract_assertions'] = [{
  'name': 'autofix-result-contract',
  'status': 'passed' if result.get('status') in {'validated','validation_failed','skipped'} else 'failed',
  'details': 'result.json contains {status, fix, validation, changedFiles}'
}]
evidence['notes'].append('repo-only')
evidence['notes'].append('remote dependencies: OPENAI_API_KEY, GitHub token, optional Cloudflare uploader secrets')
evidence_path.write_text(json.dumps(evidence, indent=2) + '\n')
PY

      - name: Finalize QA run
        run: |
          VERDICT=reproduced
          REPRO_STATUS=reproduced
          FIX_STATUS=still-reproduces
          ACCURACY=accurate
          CONFIDENCE=0.74
          if [ '${{ steps.status.outputs.status }}' = 'validated' ]; then
            VERDICT=fixed
            REPRO_STATUS=not-reproduced
            FIX_STATUS=fixed
            CONFIDENCE=0.91
          fi
          python .agents/skills/_functional-qa/scripts/qa_runtime.py finalize-run \
            --run-dir '${{ steps.qa_init.outputs.run_dir }}' \
            --verdict "$VERDICT" \
            --repro-status "$REPRO_STATUS" \
            --fix-status "$FIX_STATUS" \
            --issue-accuracy "$ACCURACY" \
            --confidence "$CONFIDENCE"

      - name: Upload QA evidence
        continue-on-error: true
        run: |
          npm run qa:upload-evidence -- --run-dir '${{ steps.qa_init.outputs.run_dir }}' --include-supporting

      - name: Publish issue update
        run: |
          python .agents/skills/_functional-qa/scripts/qa_runtime.py publish-github --run-dir '${{ steps.qa_init.outputs.run_dir }}'

      - name: Trigger trusted QA publish for PR
        if: steps.cpr.outputs.pull-request-number != ''
        run: |
          gh workflow run qa-publish.yml \
            --ref '${{ github.ref_name }}' \
            -f pr_number='${{ steps.cpr.outputs.pull-request-number }}' \
            -f issue_ref='$ISSUE_REF' \
            -f run_dir='${{ steps.qa_init.outputs.run_dir }}'
